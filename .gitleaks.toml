title = "Dema gitleaks config"

# Inherit the full gitleaks v8 default ruleset (gcp-api-key, aws-access-token,
# slack-webhook, generic high-entropy heuristics, etc.). Allowlists below only
# subtract; they never widen the scan.
[extend]
useDefault = true

# ─── Grandfathered historical finding ────────────────────────────────────────
# firebase-applet-config.json at commit 5057af3 (2026-04-18,
# "feat: Initialize BIZRA Genesis application structure") contained a Firebase
# Web SDK client config from the abandoned BIZRA Genesis Firebase Studio
# prototype that preceded Dema.
#
# Firebase WEB client API keys are identifiers, not secrets — they are meant
# to be embedded in client bundles; access is governed by Firebase Security
# Rules + App Check (per Google docs), not by key secrecy. The file was
# deleted from HEAD in d735c9b ("feat: bootstrap Dema product shell") when
# Dema pivoted to a local-first stdlib-only architecture with no Firebase
# dependency at all (current production deps: 0).
#
# Project disposition (recorded 2026-05-24 by Mumu):
#   - Firebase project 'studio-1293684429-a835a': DELETED in GCP on 2026-05-24
#   - Key 'AIzaSy...REDACTED': REVOKED by virtue of project deletion
#
# Scan confirmed this is the only GCP/Firebase key in all 374 commits of repo
# history (verified by `git grep AIzaSy` across `git rev-list --all`).
#
# The allowlist is fingerprint-scoped (commit:path:rule:line), the narrowest
# form gitleaks supports. It does NOT silence the key text globally — any
# re-leak of the same string in any other commit or file will still fail the
# gate.
[[allowlists]]
description = "Grandfathered: Firebase web SDK config of abandoned Genesis applet (project deleted 2026-05-24)"
# Gitleaks v8 AND-joins all conditions within a single [[allowlists]] block,
# so this matches ONLY findings where BOTH the commit AND the path match.
# A re-leak of the same key text in any other commit or path still fails.
commits = ["5057af345d71c0fa6ff2e437fbdd5164150aefb5"]
paths = ['''(^|/)firebase-applet-config\.json$''']

# ─── False-positive: ALLOWED_PROVENANCE_GATES string literals ────────────────
# Lines 19-23 of node0-genesis-key-ceremony-preflight.js define the
# ALLOWED_PROVENANCE_GATES constant. The string literals
# "NODE0-GENESIS-KEY-CEREMONY-1A" and "MIGRATE-HISTORICAL-GENESIS-PROOF-1A"
# contain the substrings "KEY" and "CEREMONY" / "PROOF" which can trigger
# generic high-entropy or keyword rules.
#
# These are gate-name identifiers (not secrets); they are intentionally
# committed as part of the gate-enforcement logic. The allowlist is scoped
# tightly to this single source file to avoid silencing any real secret
# in any other location.
[[allowlists]]
description = "False positive: ALLOWED_PROVENANCE_GATES gate-name literals in preflight source (not secrets)"
paths = ['''(^|/)node0-genesis-key-ceremony-preflight\.js$''']
regexes = ['''NODE0-GENESIS-KEY-CEREMONY-1A|MIGRATE-HISTORICAL-GENESIS-PROOF-1A|BLOCKED_BY_UNRESOLVED_PROVENANCE''']

# ─── False-positive: "external key custody" prose in the PDMLC audit ─────────
# The frozen PDMLC baseline audit enumerates what the project does NOT know:
#
#   **UNKNOWN:** live Node0 runtime behavior, production model/provider
#   behavior, external key custody, federation/wallet/economy behavior, ...
#
# `generic-api-key` matches the word "key" followed by a comma-separated run of
# mixed-case tokens, so a sentence ABOUT key custody trips a rule looking FOR a
# key. Entropy 3.73 — English prose, not a credential.
#
# The document is a frozen audit artifact and must not be reworded to satisfy a
# scanner; changing the text of a sealed audit to make a gate pass is exactly the
# inversion this repo exists to prevent. The allowlist is the correct mechanism.
#
# Scoped to path AND the literal phrase, which gitleaks AND-joins: a real secret
# anywhere else in this same file still fails the gate.
[[allowlists]]
description = "False positive: 'external key custody' prose in the frozen PDMLC baseline audit (not a secret)"
paths = ['''(^|/)doc-002 - BIZRA-Product-and-Engineering-Lifecycle-Audit-v1\.md$''']
regexes = ['''external key custody, federation/wallet/economy behavior''']
