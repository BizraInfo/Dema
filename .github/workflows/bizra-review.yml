name: BIZRA Review Gate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  proof-quality:
    name: proof-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Node 24 migration · canary workflow (this file only · 2026-05-24).
      # Github deprecation: Node 20 → Node 24 forced default 2026-06-02,
      # Node 20 fully removed from runners 2026-09-16. Bumped two pins:
      #   actions/checkout      v5.0.0-equivalent → v6.0.2 (de0fac2e · node24)
      #   actions/setup-node    v4.x.x           → v6.4.0 (48b55a01 · node24)
      # If this workflow runs green with no deprecation warning in the log,
      # the other 3 workflows (check.yml · codeql.yml · gitleaks.yml) get
      # the same SHA bump in a follow-up commit on this branch.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22.x
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run coverage
      - run: npm run check
      - name: Resolve BIZRA review class
        run: |
          # GITHUB_HEAD_REF is set on pull_request events only.
          # Fall back to GITHUB_REF_NAME so workflow_dispatch also works.
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$BRANCH" in
            devops/release-readiness|ci/devops-release-readiness-class)
              echo "BIZRA_REVIEW_CLASS=devops/release-readiness" >> "$GITHUB_ENV"
              ;;
            proof/u1-proof-pin|docs/u1-proof-pin|ci/u1-proof-pin-class)
              echo "BIZRA_REVIEW_CLASS=docs/u1-proof-pin" >> "$GITHUB_ENV"
              ;;
            u2/dema-preview-surfaces|ci/u2-dema-preview-class)
              echo "BIZRA_REVIEW_CLASS=u2/dema-preview-surfaces" >> "$GITHUB_ENV"
              ;;
            tooling/claim-ledger-checker|ci/claim-ledger-checker-class)
              echo "BIZRA_REVIEW_CLASS=tooling/claim-ledger-checker" >> "$GITHUB_ENV"
              ;;
            u2.1/amana-kernel-contracts|ci/u2.1-amana-kernel-contracts-class)
              echo "BIZRA_REVIEW_CLASS=u2.1/amana-kernel-contracts" >> "$GITHUB_ENV"
              ;;
            proof/u1-*)
              echo "BIZRA_REVIEW_CLASS=proof/u1" >> "$GITHUB_ENV"
              ;;
            adr/*|policy/*|governance/*|tooling/*|season-*|fix/*|ci/*|docs/*|feat/*|chore/*|pr/*|refactor/*|test/*|copilot/*)
              # pr/* is the clean release-train convention (single-commit
              # cherry-picks off main). refactor/*, test/*, and copilot/* are
              # accepted as broad-scope too. No proof gate is weakened: pr-class,
              # proof-scope, no-overclaim, and receipt-integrity all still run
              # under the broad-scope class below.
              echo "BIZRA_REVIEW_CLASS=policy/broad-scope" >> "$GITHUB_ENV"
              ;;
            main)
              # Triggered by push to main (post-merge canonical state).
              # Runs no-overclaim + receipt-integrity on the merged state;
              # pr-class + proof-scope use the merged-to-main class with
              # no file-set enforcement (canonical state is already gated).
              echo "BIZRA_REVIEW_CLASS=policy/merged-to-main" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported BIZRA review branch: $BRANCH" >&2
              exit 1
              ;;
          esac
      - run: node scripts/review/pr-class.mjs --class "$BIZRA_REVIEW_CLASS"
      - run: node scripts/review/proof-scope.mjs --class "$BIZRA_REVIEW_CLASS"
      - run: node scripts/review/no-overclaim.mjs --class "$BIZRA_REVIEW_CLASS"
      - run: node scripts/review/receipt-integrity.mjs --class "$BIZRA_REVIEW_CLASS"
