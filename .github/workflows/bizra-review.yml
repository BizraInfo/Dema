name: BIZRA Review Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  proof-quality:
    name: proof-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - name: Resolve BIZRA review class
        run: |
          case "${GITHUB_HEAD_REF}" in
            proof/u1-proof-pin|docs/u1-proof-pin|ci/u1-proof-pin-class)
              echo "BIZRA_REVIEW_CLASS=docs/u1-proof-pin" >> "$GITHUB_ENV"
              ;;
            proof/u1-*)
              echo "BIZRA_REVIEW_CLASS=proof/u1" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported BIZRA review branch: ${GITHUB_HEAD_REF}" >&2
              exit 1
              ;;
          esac
      - run: node scripts/review/pr-class.mjs --class "$BIZRA_REVIEW_CLASS"
      - run: node scripts/review/proof-scope.mjs --class "$BIZRA_REVIEW_CLASS"
      - run: node scripts/review/no-overclaim.mjs --class "$BIZRA_REVIEW_CLASS"
      - run: node scripts/review/receipt-integrity.mjs --class "$BIZRA_REVIEW_CLASS"
