name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: npm test
      # `npm run coverage` and `npm run check` (which internally calls coverage
      # via scripts/check.mjs) both depend on --test-coverage-{lines,branches,
      # functions} threshold flags that require Node 22+. Skip both on 20.x;
      # tests still run on both versions.
      - if: matrix.node-version == '22.x'
        run: npm run coverage
      - if: matrix.node-version == '22.x'
        run: npm run check
      - if: matrix.node-version == '22.x'
        run: npm run perf
      # DELIVERY-CHECK-1A integration (A+ blueprint gate per DELIVERY_BLUEPRINT).
      # Level 5 (Optimizing) CI/CD: sealed local forcing function on Node 22 matrix.
      - if: matrix.node-version == '22.x'
        run: npm run delivery:check
      # NODE0-CI-EVIDENCE-ATTESTATION-EXPORT-1B: verified JSON artifact for local gather.
      - if: matrix.node-version == '22.x'
        run: npm run proof:attest:ci
        env:
          NODE0_CI_EVIDENCE_EXPORT_CONTEXT: post_check
      - if: matrix.node-version == '22.x'
        run: DEMA_CI_EVIDENCE_ATTESTATION_PATH=./node0-ci-evidence-attestation.json node scripts/audit/node0-proof-of-truth-control-plane.mjs --json > /dev/null
      - if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: node0-ci-evidence-attestation-${{ matrix.node-version }}
          path: node0-ci-evidence-attestation.json
          if-no-files-found: error
