name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      # `npm run coverage` and `npm run check` (which internally calls coverage
      # via scripts/check.mjs) both depend on --test-coverage-{lines,branches,
      # functions} threshold flags that require Node 22+. Skip both on 20.x;
      # tests still run on both versions.
      - if: matrix.node-version == '22.x'
        run: npm run coverage
      - if: matrix.node-version == '22.x'
        run: npm run check
