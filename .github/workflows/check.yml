name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: npm test
      # `npm run coverage` and `npm run check` (which internally calls coverage
      # via scripts/check.mjs) both depend on --test-coverage-{lines,branches,
      # functions} threshold flags that require Node 22+. Skip both on 20.x;
      # tests still run on both versions.
      - if: matrix.node-version == '22.x'
        run: npm run coverage
      - if: matrix.node-version == '22.x'
        run: npm run check
      - if: matrix.node-version == '22.x'
        run: npm run perf
