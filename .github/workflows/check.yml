name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: npm test
      # `npm run coverage` and `npm run check` (which internally calls coverage
      # via scripts/check.mjs) both depend on --test-coverage-{lines,branches,
      # functions} threshold flags that require Node 22+. Skip both on 20.x;
      # tests still run on both versions.
      - if: matrix.node-version == '22.x'
        run: npm run coverage
      - if: matrix.node-version == '22.x'
        run: npm run check
      - if: matrix.node-version == '22.x'
        run: npm run perf
      # DELIVERY-CHECK-1A integration (A+ blueprint gate per DELIVERY_BLUEPRINT).
      # Level 5 (Optimizing) CI/CD: the sealed local forcing function (perf budgets,
      # release-readiness, mu 104/104 pre-push:seal, llm:guidance, diff-check) now
      # runs on the Node 22 matrix in CI for remote empirical proof of the elite
      # full-stack delivery (PMBOK + DevOps value stream + continuous improvement ring).
      # continue-on-error during rollout for visibility; becomes hard gate post remote seal.
      # Uses execFileSync(argv) only (actuator boundary clean). No runtime, no secrets.
      - if: matrix.node-version == '22.x'
        run: npm run delivery:check
        continue-on-error: true
